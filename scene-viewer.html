<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Scene Viewer — Web Engines Compare</title>
    <link rel="icon" href="data:,">
    <style>
        html, body { margin: 0; background: #111; }
        #label {
            position: fixed; top: 8px; left: 8px; z-index: 10;
            color: #fff; background: rgba(0,0,0,0.7); font: 13px monospace;
            padding: 6px 10px; border-radius: 4px; pointer-events: none;
        }
        canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div id="label">loading…</div>
    <canvas id="scene-canvas"></canvas>
    <script type="module">
        // Dev tool: renders the shared benchmark scene with one engine so
        // visual parity between engines can be checked side by side.
        // Usage: scene-viewer.html?engine=three&count=1000&materials=100&complexity=complex
        // `engine` matches an entry id or engine name from engines.config.js.
        import { ENGINE_VERSIONS } from './engines.config.js';
        import { createAdapter } from './adapters/index.js';
        import { loadEngineModule } from './lib/loader.js';

        const params = new URLSearchParams(location.search);
        const engineKey = params.get('engine') || 'playcanvas';
        const count = parseInt(params.get('count') || '1000', 10);
        const materialCount = parseInt(params.get('materials') || '100', 10);
        const complexity = params.get('complexity') || 'simple';

        const entry = ENGINE_VERSIONS.find((e) => e.id === engineKey) ||
            ENGINE_VERSIONS.find((e) => e.engine === engineKey);
        if (!entry) throw new Error(`No engine entry matches '${engineKey}'`);

        const label = document.getElementById('label');
        label.textContent = `${entry.label} — ${count} cubes, ${materialCount} materials, ${complexity}`;

        const module = await loadEngineModule(entry);
        const adapter = createAdapter(entry, module);
        await adapter.init({ canvas: document.getElementById('scene-canvas'), materialCount, complexity });
        adapter.setCubeCount(count);
        let frames = 0;
        adapter.start(() => { frames++; });
        window.addEventListener('resize', () => adapter.resize());
        window.__frames = () => frames;
    </script>
</body>
</html>
